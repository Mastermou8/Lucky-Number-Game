<HTML Lang="en">
	<HEAD>
		<META CHARSET="UTF-8">
		<TITLE>LuckyNumberGame</TITLE>
		<SCRIPT>
			class main{
				//constructor
				constructor(){
					
					this.consoleSelection = document.getElementById("console");
					this.programName=""
					//start variables
					this.firstNum= 0;
					this.SecondNum = 0;
					this.wins = 0;
					this.losses = 0;
					
				}
				
			playGame(){
				this.SecondNum = Math.floor(Math.random() * 100) + 1;
				this.firstNum = Math.floor(Math.random() * 100) + 1;	
				
				//rules: if 2nd num is higher than 1st win, else lose
				//tell the player if they won or lose and provide numbers 
				if(this.firstNum <this.SecondNum){
				this.wins +=1;
				this.consoleSelection.innerHTML = "<p> 	You Win! 1st: " + this.firstNum + " < 2nd: " + this.SecondNum + "</p>";
				
				} else {
				this.losses +=1;
				this.consoleSelection.innerHTML = "<p> 	You Lose! 1st: " + this.firstNum + " > 2nd: " + this.SecondNum + "</p>";
				}
				
				//update the win / lose counter
			this.consoleSelection.innerHTML += "<p>Wins: " + this.wins + " | Losses: " + this.losses + "</p>";
			
			//Update the image facebased on wins or losses.
			const faceImg = document.getElementById('faceImg');
			if(this.wins>this.losses){
				faceImg.src= "images/HAPPY.png";
			} else if(this.wins < this.losses){
				faceImg.src = "images/SAD.png";
			} else {
				//this face is meant to represent the nervousness of being about to lose
				faceImg.src = "images/READY.jpg";
			}
			}
			
				
		}
		</SCRIPT>
	</HEAD>
	<BODY>
		<HEADER><H1>Lucky Number Game</H1></HEADER>
		<SECTION id="console"></SECTION>
		<BUTTON id ="rollButton"> Roll Number
		</BUTTON>
		<IMG id="faceImg" src="" alt="Fail" style="width:250px; height: 250px;">
		<SCRIPT>
			myMain = new main();
			//button element 
			function globalPlayGame(){
				myMain.playGame();
			}
			const rollButton = document.getElementById('rollButton');
			//event listener call playGame function on main
			rollButton.addEventListener('click', globalPlayGame);
		</SCRIPT>
	
	</BODY>
</HTML>
